name: Release Events

on:
  release:
    types: [published]

concurrency:
  group: "${{ github.head_ref || github.ref }}"
  cancel-in-progress: true

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    if: github.event.release.prerelease == false
    permissions:
      id-token: write
      deployments: write
    environment:
      name: prod

    steps:
      - name: ⬇️ Set up code
        uses: actions/checkout@v7
        with:
          show-progress: false

      - name: 🗝️ Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          create_credentials_file: true
          token_format: access_token
          workload_identity_provider: ${{ secrets.IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT_EMAIL }}

      - name: 🐳 Set up Docker Buildx
        id: builder
        uses: docker/setup-buildx-action@v4

      - name: 🗝️ Authenticate Docker to Google Cloud
        uses: docker/login-action@v4
        with:
          registry: us-central1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: 🏷️ Extract tags from GitHub
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: us-central1-docker.pkg.dev/${{ secrets.PROJECT_ID }}/images/app
          tags: |
            type=ref,suffix=-{{sha}},event=branch
            type=ref,prefix=pr-,suffix=-{{sha}},event=pr
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: 📦 Build and push image
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.builder.outputs.name }}
          tags: ${{ steps.meta.outputs.tags }}
          provenance: false
          context: .
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🔍️ Set Image Name
        run: |
          IMAGE_ID=$(echo $DOCKER_METADATA_OUTPUT_TAGS | cut -d ' ' -f 1)
          echo "IMAGE_ID=$IMAGE_ID" >> $GITHUB_ENV

      - name: 🚀 Deploy Cloud Run Job
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          job: cloudb
          image: ${{ env.IMAGE_ID }}
          region: us-west3
          flags: |
            --tasks=1
            --parallelism=1
            --max-retries=3
            --task-timeout=30m
            --service-account=cloud-run-sa@${{ secrets.PROJECT_ID }}.iam.gserviceaccount.com
            --vpc-connector=${{ secrets.VPC }}
            --vpc-egress=all-traffic
            --cpu=1
            --memory=512Mi
          env_vars: LOG_LEVEL=INFO
          secrets: |
            /secrets/db/connection=database-connections:latest

      - name: 🕰️ Create cloud scheduler
        run: |
          SCHEDULE_URI="https://run.googleapis.com/v2/projects/${{ secrets.PROJECT_ID }}/locations/us-west3/jobs/cloudb:run"

          if gcloud scheduler jobs describe cloudb --location=us-west3 >/dev/null 2>&1; then
            gcloud scheduler jobs update http cloudb \
              --description="Execute the cloudb Cloud Run Job daily at 12 AM" \
              --schedule="0 0 * * *" \
              --time-zone=America/Denver \
              --uri="$SCHEDULE_URI" \
              --http-method=POST \
              --max-retry-attempts=0 \
              --oauth-service-account-email=cloud-scheduler-sa@${{ secrets.PROJECT_ID }}.iam.gserviceaccount.com \
              --location=us-west3 \
              --quiet
          else
            gcloud scheduler jobs create http cloudb \
              --description="Execute the cloudb Cloud Run Job daily at 12 AM" \
              --schedule="0 0 * * *" \
              --time-zone=America/Denver \
              --uri="$SCHEDULE_URI" \
              --http-method=POST \
              --max-retry-attempts=0 \
              --oauth-service-account-email=cloud-scheduler-sa@${{ secrets.PROJECT_ID }}.iam.gserviceaccount.com \
              --location=us-west3 \
              --quiet
          fi

  notify:
    name: Comment on issues
    runs-on: ubuntu-latest
    needs: [deploy-prod]
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: 💬 Comment on issues in release
        uses: agrc/release-issue-notifications-action@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
